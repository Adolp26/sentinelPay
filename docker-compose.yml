services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sentinelpay
      POSTGRES_PASSWORD: sentinelpay
      POSTGRES_DB: sentinelpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelpay -d sentinelpay"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
